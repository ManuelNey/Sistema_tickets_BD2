name: CI

# Corre en cada Pull Request hacia main y en pushes a main.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  # 1) El backend tiene que compilar.
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore backend/backend.sln
      - name: Build
        run: dotnet build backend/backend.sln --no-restore --configuration Release

  # 2) El front tiene que pasar lint y buildear (atrapa imports rotos / syntax).
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  # 3) Smoke test: levanta todo el stack y verifica que Swagger y el front respondan.
  smoke-test:
    runs-on: ubuntu-latest
    needs: [ backend-build, frontend-build ]
    steps:
      - uses: actions/checkout@v4

      - name: Levantar el stack
        run: docker compose up -d --build

      - name: Esperar a que Swagger responda
        run: |
          echo "Esperando al backend (Swagger)..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/swagger/v1/swagger.json > /dev/null; then
              echo "OK: Swagger responde."
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: Swagger no respondio a tiempo."
          docker compose logs backend
          exit 1

      - name: Esperar a que el front responda
        run: |
          echo "Esperando al frontend..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5173 > /dev/null; then
              echo "OK: Front responde."
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: El front no respondio a tiempo."
          docker compose logs frontend
          exit 1

      - name: Logs si algo fallo
        if: failure()
        run: docker compose logs

      - name: Bajar el stack
        if: always()
        run: docker compose down -v
